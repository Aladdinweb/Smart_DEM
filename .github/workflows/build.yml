name: Release Smart DEM

on:
  push:
    tags: ["v*"]          # ex : v1.0.0 — déclenchement automatique à la création du tag
  workflow_dispatch:      # build de test manuel (sans publication)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Version SemVer + cohérence avec le tag
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Version invalide (SemVer MAJEUR.MINEUR.CORRECTIF attendu) : $v" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à version.py (v$v). Corrigez version.py puis recréez le tag." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller

      - name: Tests (données, migration, Hub, SemVer — bloquants)
        run: python -m unittest tests.test_core tests.test_packaging -v

      - name: Test de fumée de l'interface (Qt hors écran) — non bloquant pour l'instant
        continue-on-error: true      # passer à false une fois ce test vert de façon stable
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_ui_smoke -v

      - name: Compilation PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name Smart_DEM
          --add-data "schema.sql;."
          --add-data "assets;assets"
          --icon assets\smart_dem.ico
          --hidden-import simple_websocket --hidden-import wsproto --hidden-import h11 --hidden-import segno --collect-submodules cryptography --hidden-import PIL
          main.py

      - name: Auto-test de l'exécutable COMPILÉ (chaque espace doit s'ouvrir) — bloquant
        shell: pwsh
        run: |
          $p = Start-Process dist\Smart_DEM\Smart_DEM.exe -ArgumentList "--selftest","$PWD\selftest.txt" -PassThru -Wait
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "selftest.txt absent" }
          if ($p.ExitCode -ne 0) { throw "Auto-test de l'exécutable en échec : un module manque dans le paquet ou une fenêtre ne s'ouvre pas" }

      - name: Paquet de mise à jour (ZIP) + SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Smart_DEM\* -DestinationPath Smart_DEM_update.zip
          $h = (Get-FileHash Smart_DEM_update.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Smart_DEM_update.zip" | Out-File -Encoding ascii Smart_DEM_update.zip.sha256

      - name: Installateur Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Smart_DEM_${{ steps.ver.outputs.version }}
          path: |
            Output/Smart_DEM_Setup.exe
            Smart_DEM_update.zip
            Smart_DEM_update.zip.sha256

      - name: Publication GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Smart DEM v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}   # 1.1.0-rc.1 => pré-version (ignorée par /releases/latest)
          files: |
            Output/Smart_DEM_Setup.exe
            Smart_DEM_update.zip
            Smart_DEM_update.zip.sha256
